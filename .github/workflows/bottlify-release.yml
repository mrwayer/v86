# Bottlify infrastructure (not an upstream candidate).
#
# Builds this fork and publishes the artifacts Bottlify consumes as a GitHub
# release, so a Bottlify checkout can fetch a prebuilt v86 instead of needing
# the full Rust/clang/closure toolchain locally.
name: bottlify-release

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
          rustc --version
          clang --version | head -1
          java -version 2>&1 | head -1

      - name: Build
        run: make all

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp build/libv86.mjs build/libv86.js build/v86.wasm out/

      # A second emulator that counts what it does: retired instructions by
      # opcode, exits from generated code by cause, every slow path taken. Same
      # sources, same module interface, so the launcher can load either; a
      # measurement wants this one, a player wants the other.
      - name: Build with the profiler
        run: |
          make with-profiler
          cp build/v86.wasm out/v86-profiler.wasm
          cp bios/seabios.bin bios/vgabios.bin out/
          cd out
          sha256sum * | tee SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$(git rev-parse --short HEAD)"
          NOTES="Automated build of $(git rev-parse HEAD) for Bottlify."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" \
              --title "v86 build $TAG" --notes "$NOTES"
          fi
